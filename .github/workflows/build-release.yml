name: Build relay release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release identifier
        required: true
        type: string
      component:
        description: Component to build and release independently
        required: true
        type: choice
        options:
          - new-api
          - cpa
          - full
        default: full
      cpa_version:
        description: Optional CPA version label for the manifest
        required: false
        type: string
      new_api_ref:
        description: Human-selected New API fork/upstream ref (commit or tag)
        required: false
        type: string
      cpa_ref:
        description: Human-selected CPA ref (commit or tag)
        required: false
        type: string
      cpa_panel_ref:
        description: Human-selected matching CPA management panel release tag
        required: false
        type: string
      cpa_compatibility_id:
        description: Optional reviewed CPA/backend-panel compatibility identifier
        required: false
        type: string
      cpa_repository:
        description: CPA repository or fork URL used for the selected ref
        required: false
        default: https://github.com/router-for-me/CLIProxyAPI.git
        type: string
      cpa_panel_repository:
        description: Management panel repository or fork URL used for the selected release
        required: false
        default: https://github.com/fanfan9396-oss/Cli-Proxy-API-Management-Centert-Center
        type: string
      new_api_repository:
        description: New API repository or fork URL used for the selected ref
        required: false
        default: https://github.com/fanfan9396-oss/new-api.git
        type: string
permissions:
  contents: read

concurrency:
  group: relay-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_ID: ${{ inputs.release_id || github.ref_name }}
      COMPONENT: ${{ inputs.component || 'full' }}
      CPA_VERSION: ${{ inputs.cpa_version || '' }}
      NEW_API_REF: ${{ inputs.new_api_ref || '' }}
      CPA_REF: ${{ inputs.cpa_ref || '' }}
      CPA_PANEL_REF: ${{ inputs.cpa_panel_ref || '' }}
      CPA_COMPATIBILITY_ID: ${{ inputs.cpa_compatibility_id || '' }}
      CPA_REPOSITORY: ${{ inputs.cpa_repository || 'https://github.com/router-for-me/CLIProxyAPI.git' }}
      CPA_PANEL_REPOSITORY: ${{ inputs.cpa_panel_repository || 'https://github.com/fanfan9396-oss/Cli-Proxy-API-Management-Centert-Center' }}
      NEW_API_REPOSITORY: ${{ inputs.new_api_repository || 'https://github.com/fanfan9396-oss/new-api.git' }}
      OUTPUT_DIR: output/${{ inputs.release_id || github.ref_name }}

    steps:
      - name: Checkout pinned repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Prepare human-selected component refs
        run: bash tools/prepare-component-refs.sh

      - name: Build manually-approved component release package
        run: bash tools/build-release.sh

      - name: Verify package manifest and checksums
        run: |
          cd "$OUTPUT_DIR"
          sha256sum -c SHA256SUMS.txt
          grep -q "^component=${COMPONENT}$" manifest.txt
          if [[ "$COMPONENT" == "cpa" || "$COMPONENT" == "full" ]]; then test -s CLIProxyAPI-linux-amd64; test -s management.html; fi
          if [[ "$COMPONENT" == "new-api" || "$COMPONENT" == "full" ]]; then test -s new-api-linux-amd64; fi
          grep -q '^production_deploy=not-authorized$' manifest.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ID }}
          path: |
            ${{ env.OUTPUT_DIR }}.tar.gz
            ${{ env.OUTPUT_DIR }}/manifest.txt
            ${{ env.OUTPUT_DIR }}/SHA256SUMS.txt
          retention-days: 14
