# Copy this file to config.yaml and replace the placeholder API key.
# Upstream provider credentials are managed under runtime/cpa/auths/.

host: ""
port: 8317

remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true

auth-dir: "/root/.cli-proxy-api"

api-keys:
  - "replace-with-the-value-of-CPA_API_KEY"

debug: false

